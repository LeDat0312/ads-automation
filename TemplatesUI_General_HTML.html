<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General - Rules Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        .header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .btn-primary {
            background: #ffc107;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }
        
        .banner {
            background: #e8d5ff;
            padding: 15px 20px;
            margin: 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .banner-close {
            margin-left: auto;
            cursor: pointer;
        }
        
        .banner-link {
            color: #0d6efd;
            text-decoration: none;
        }
        
        .toolbar {
            background: white;
            padding: 15px 20px;
            margin: 0 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .filter-tabs {
            display: flex;
            gap: 5px;
        }
        
        .filter-tab {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 14px;
        }
        
        .filter-tab.active {
            background: #333;
            color: white;
        }
        
        .customization-tabs {
            display: flex;
            gap: 15px;
            margin: 20px;
            padding: 0;
        }
        
        .customization-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: none;
            border: none;
            color: #0d6efd;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }
        
        .customization-tab.active {
            border-bottom-color: #0d6efd;
        }
        
        .rules-list {
            margin: 20px;
        }
        
        .folder-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .folder-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        
        .folder-checkbox {
            width: 18px;
            height: 18px;
        }
        
        .folder-icon {
            font-size: 20px;
        }
        
        .folder-name {
            font-weight: 600;
            font-size: 16px;
        }
        
        .folder-rules-count {
            color: #666;
            font-size: 14px;
            margin-left: 5px;
        }
        
        .rule-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-left: 30px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .rule-item:hover {
            background: #f5f5f5;
        }
        
        .rule-item:hover .rule-actions {
            opacity: 1;
        }
        
        .rule-checkbox {
            width: 18px;
            height: 18px;
        }
        
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle-switch.active {
            background: #0d6efd;
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        
        .toggle-switch.active::after {
            left: 22px;
        }
        
        .rule-info {
            flex: 1;
        }
        
        .rule-name {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .rule-account {
            color: #666;
            font-size: 12px;
        }
        
        .rule-status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            background: #f0f0f0;
            color: #666;
        }
        
        .rule-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .action-btn:hover {
            background: #e0e0e0;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>General</h1>
        <div class="header-actions">
            <button class="icon-btn" title="More options">⋯</button>
            <button class="icon-btn" title="Duplicate">📄</button>
            <button class="btn-primary" onclick="createRule()">+ Create rule</button>
        </div>
    </div>

    <div class="banner" id="infoBanner">
        <span>👆</span>
        <span>Check out our examples of automated rules and start experimenting. <a href="#" class="banner-link">Learn more →</a></span>
        <span class="banner-close" onclick="closeBanner()">×</span>
    </div>

    <div class="toolbar">
        <input type="text" class="search-box" placeholder="Search" id="searchInput" onkeyup="searchRules()">
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterRules('all')">All rules</button>
            <button class="filter-tab" onclick="filterRules('active')">Active</button>
            <button class="filter-tab" onclick="filterRules('triggered')">Triggered <span>ℹ</span></button>
        </div>
        <select class="select-input" id="accountFilter" onchange="filterByAccount()">
            <option value="">All ad accounts</option>
        </select>
        <button class="icon-btn" title="Sort">⇅</button>
    </div>

    <div class="customization-tabs">
        <button class="customization-tab active" onclick="showCustomization('strategies')">
            <span>+</span>
            <span>Strategies</span>
        </button>
        <button class="customization-tab" onclick="showCustomization('metrics')">
            <span>🔗</span>
            <span>Custom metrics</span>
        </button>
        <button class="customization-tab" onclick="showCustomization('timeframes')">
            <span>🕐</span>
            <span>Custom timeframes</span>
        </button>
    </div>

    <div class="rules-list" id="rulesList">
        <div class="empty-state">
            <p>No rules yet. Create your first rule!</p>
        </div>
    </div>

    <script>
        let allRules = [];
        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadRules();
            loadAccounts();
        });

        function loadRules() {
            google.script.run
                .withSuccessHandler(function(folders) {
                    renderRules(folders);
                })
                .withFailureHandler(function(error) {
                    console.error('Error loading rules:', error);
                })
                .getAllRuleFolders();
        }

        function renderRules(folders) {
            const container = document.getElementById('rulesList');
            container.innerHTML = '';

            if (folders.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No rules yet. Create your first rule!</p></div>';
                return;
            }

            folders.forEach(function(folder) {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder-item';
                
                let rulesHtml = `
                    <div class="folder-header">
                        <input type="checkbox" class="folder-checkbox" onchange="toggleFolderSelection('${folder.id}', this.checked)">
                        <span class="folder-icon">📁</span>
                        <span class="folder-name">${folder.name}</span>
                        <span class="folder-rules-count">${folder.rules.length} rules</span>
                    </div>
                `;

                // Load rules for this folder
                folder.rules.forEach(function(ruleId) {
                    loadRuleDetails(ruleId, folderDiv);
                });

                folderDiv.innerHTML = rulesHtml;
                container.appendChild(folderDiv);
            });
        }

        function loadRuleDetails(ruleId, container) {
            google.script.run
                .withSuccessHandler(function(rule) {
                    if (rule) {
                        const ruleDiv = document.createElement('div');
                        ruleDiv.className = 'rule-item';
                        ruleDiv.innerHTML = `
                            <input type="checkbox" class="rule-checkbox">
                            <div class="toggle-switch ${rule.status === 'LIVE' ? 'active' : ''}" 
                                 onclick="toggleRule('${rule.id}', this)" 
                                 data-rule-id="${rule.id}"></div>
                            <div class="rule-info">
                                <div class="rule-name">${rule.name}</div>
                                <div class="rule-account">${rule.accounts.length > 0 ? rule.accounts[0].name : 'No account'}</div>
                            </div>
                            <div class="rule-status">${rule.status}</div>
                            <div class="rule-actions">
                                <button class="action-btn" onclick="editRule('${rule.id}')" title="Edit">✏</button>
                                <button class="action-btn" onclick="duplicateRule('${rule.id}')" title="Duplicate">📋</button>
                                <button class="action-btn" onclick="deleteRule('${rule.id}')" title="Delete">🗑</button>
                                <button class="action-btn" onclick="viewLogs('${rule.id}')" title="Logs">Logs</button>
                            </div>
                        `;
                        container.appendChild(ruleDiv);
                    }
                })
                .withFailureHandler(function(error) {
                    console.error('Error loading rule:', error);
                })
                .getRuleData(ruleId);
        }

        function toggleRule(ruleId, toggleElement) {
            const isActive = toggleElement.classList.contains('active');
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        toggleElement.classList.toggle('active');
                        // Update status badge
                        const statusBadge = toggleElement.parentElement.querySelector('.rule-status');
                        statusBadge.textContent = isActive ? 'DRAFT' : 'LIVE';
                    }
                })
                .withFailureHandler(function(error) {
                    alert('Error toggling rule: ' + error);
                })
                .toggleRuleStatus(ruleId, !isActive);
        }

        function editRule(ruleId) {
            window.location.href = '?page=scale-ad-sets&ruleId=' + ruleId;
        }

        function duplicateRule(ruleId) {
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        loadRules();
                    }
                })
                .withFailureHandler(function(error) {
                    alert('Error duplicating rule: ' + error);
                })
                .duplicateRule(ruleId);
        }

        function deleteRule(ruleId) {
            if (confirm('Are you sure you want to delete this rule?')) {
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (result.success) {
                            loadRules();
                        }
                    })
                    .withFailureHandler(function(error) {
                        alert('Error deleting rule: ' + error);
                    })
                    .deleteRule(ruleId);
            }
        }

        function viewLogs(ruleId) {
            // TODO: Open logs modal
            alert('View logs for rule: ' + ruleId);
        }

        function createRule() {
            window.location.href = '?page=scale-ad-sets';
        }

        function filterRules(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(function(tab) {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            // TODO: Filter rules
            loadRules();
        }

        function searchRules() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            // TODO: Filter rules by query
        }

        function loadAccounts() {
            google.script.run
                .withSuccessHandler(function(accounts) {
                    const select = document.getElementById('accountFilter');
                    accounts.forEach(function(account) {
                        const option = document.createElement('option');
                        option.value = account.id;
                        option.textContent = account.name;
                        select.appendChild(option);
                    });
                })
                .withFailureHandler(function(error) {
                    console.error('Error loading accounts:', error);
                })
                .getConnectedAccounts();
        }

        function filterByAccount() {
            const accountId = document.getElementById('accountFilter').value;
            // TODO: Filter rules by account
        }

        function showCustomization(type) {
            document.querySelectorAll('.customization-tab').forEach(function(tab) {
                tab.classList.remove('active');
            });
            event.target.closest('.customization-tab').classList.add('active');
            // TODO: Show customization options
        }

        function closeBanner() {
            document.getElementById('infoBanner').style.display = 'none';
        }

        function toggleFolderSelection(folderId, checked) {
            // TODO: Select all rules in folder
        }
    </script>
</body>
</html>
